[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "snippets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "matplotlib>=3.10.3",
    "mechanize>=0.4.10",
    "psutil>=7.0.0",
    "pypdf>=5.6.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "furo>=2024.8.6",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "sphinx>=8.1.3",
    "sphinxcontrib-shtest>=0.5.0",
]

